<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- daisy UI and tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="styles/tracker.css"></head>
<body>
    <header>
        <div class="navbar bg-base-100 shadow-sm ">
            <div class="max-w-[1440px] w-full mx-auto flex justify-between items-center">
                <div class="navbar-start">
                    <!-- <div class="dropdown">
                        <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /> </svg>
                        </div>
                        <ul
                            tabindex="-1"
                            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                            <li><a>Item 1</a></li>
                            <li><a>Item 3</a></li>
                        </ul>
                    </div> -->
                    <a class="flex items-center text-xl">
                        <img class="w-7 h-7 mr-1" src="assets/github-logo.png" alt="GitHub Issues Tracker">
                        <span class="text-sm md:text-xl font-semibold">GitHub Issues Tracker</span>
                    </a>
                </div>

                <div class="navbar-end">
                    <label class="input mr-1 md:mr-4 p-1 max-h-[33px] md:max-h-none">
                        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <g
                            stroke-linejoin="round"
                            stroke-linecap="round"
                            stroke-width="2.5"
                            fill="none"
                            stroke="currentColor"
                            >
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.3-4.3"></path>
                            </g>
                        </svg>

                        <input id="issue-search" name="issue-search" class="outline-none focus-within:outline-none focus-within:ring-0 focus-within:border-transparent" type="search" required placeholder="Search Issues ..." />
                    </label>

                    <button class="btn btn-primary btn-sm md:btn-md text-white">+ New Issue</button>
                </div>
            </div>
        </div>
    </header>

    <main class="bg-[#f8fafc]">
        <div class="main-container max-w-[1110px] mx-auto md:pt-[60px] md:pb-[60px]">
            <section id="tab-container" class="bg-white shadow-lg rounded-lg p-6">
                <button data-id="tab-all" class="issue-tracker-btn btn btn-neutral btn-sm md:btn-md btn-outline border-[#E4E4E7] text-[#64748B] hover:bg-primary hover:text-white hover:border-0 md:min-w-[120px]">All</button>
                <button data-id="tab-open" class="issue-tracker-btn btn btn-neutral btn-sm md:btn-md btn-outline border-[#E4E4E7] text-[#64748B] hover:bg-primary hover:text-white hover:border-0 md:min-w-[120px]">Open</button>
                <button data-id="tab-closed" class="issue-tracker-btn btn btn-neutral btn-sm md:btn-md btn-outline border-[#E4E4E7] text-[#64748B] hover:bg-primary hover:text-white hover:border-0 md:min-w-[120px]">Closed</button>
            </section>

            <section id="issue-container" class="mt-4 shadow-lg rounded-lg">
                <div class="issue-container">
                    <div class="issue-top-container flex justify-between items-center bg-white p-6 rounded-lg">
                        <div class="issue-number-container flex gap-2">
                            <img class="" src="assets/Aperture.png" alt="Aperture">
                            <div class="">
                                <p id="issue-number" class="font-semibold md:text-[20px]"></p>
                                <p class="text-[8px] md:text-[12px] gray-color">Track and manage your project issues</p>
                            </div>
                        </div>

                        <div class="text-[12px] open-closed flex items-center gap-4">
                            <p><span id="open"></span> Open</p>
                            <p><span id="closed"></span> Closed</p>
                        </div>
                    </div>

                    <div id="issue-bottom-container" class="grid grid-cols-1 md:grid-cols-4 gap-[13px] p-[25px] border-t border-[#E4E4E7]"></div>
                </div>

                <div id="issue-modal">
                    <dialog id="issue-modal-dialog" class="modal modal-bottom sm:modal-middle">
                        <div class="modal-box">
                            <div id="modal-content" class="space-y-6"></div>

                            <div class="modal-action">
                                <form method="dialog">
                                    <button class="btn btn-primary">Close</button>
                                </form>
                            </div>
                        </div>
                    </dialog>
                </div>

                <div id="loading-spinner" class="h-[60vh] flex hidden justify-center items-center" >
                    <span class="loading loading-spinner text-success loading-xl" ></span>
                </div>
            </section>
        </div>
    </main>
    
    <script src="scripts/tracker.js"></script>
</body>
</html>
