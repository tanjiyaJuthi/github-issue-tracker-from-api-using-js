<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- daisy UI and tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="styles/tracker.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-base-200">
    <main class="w-full md:w-4/12 max-w-[520px] p-8 shadow-xl bg-white rounded-lg">
        <div class="login-container space-y-6">
            <div class="login-top text-center">
                <img class="mx-auto" src="assets/github-logo.png" alt="Github">
                <h1 class="font-semibold text-xl mt-8 mb-1">GitHub Issues Tracker</h1>
                <p class="gray-color text-[18px]">Sign in to manage your issues</p>
            </div>

            <div class="login-bottom">
                <fieldset class="fieldset">
                    <legend class="fieldset-legend">Username</legend>
                    <input type="email" class="input w-full bg-[#F8FAFC] focus:outline-none focus:ring-0 border-[#ececef]" placeholder="Email" />

                    <legend class="fieldset-legend">Password</legend>
                    <input type="password" class="input w-full bg-[#F8FAFC] focus:outline-none focus:ring-0 border-[#ececef]" placeholder="Enter Password" />

                    <button class="btn btn-primary mt-4">Sign In</button>
                </fieldset>
            </div>
        </div>
    </main>

    <script src="scripts/tracker.js"></script>
</body>
</html>
