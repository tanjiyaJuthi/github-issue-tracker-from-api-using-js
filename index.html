<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- daisy UI and tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="styles/tracker.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-base-200">
    <main class="w-full max-w-[420px] p-6 md: p-8 shadow-xl bg-white rounded-lg">
        <div class="login-container space-y-6">
            <div class="login-top text-center">
                <img class="mx-auto" src="assets/github-logo.png" alt="Github">
                <h1 class="font-semibold text-xl mt-8 mb-1">GitHub Issues Tracker</h1>
                <p class="gray-color text-[18px]">Sign in to manage your issues</p>
            </div>

            <div class="login-middle">
                <fieldset class="fieldset">
                    <legend class="fieldset-legend">Username</legend>
                    <input id="login-user-name" type="text" class="input w-full bg-[#F8FAFC] focus:outline-none focus:ring-0 border-[#ececef]" placeholder="Email" />

                    <legend class="fieldset-legend">Password</legend>
                    <input id="login-password" type="password" class="input w-full bg-[#F8FAFC] focus:outline-none focus:ring-0 border-[#ececef]" placeholder="Enter Password" />

                    <button id="login-btn" class="btn btn-primary mt-4">Sign In</button>
                </fieldset>
            </div>
            
            <div class="login-bottom text-center mt-4">
                <h3 class="gray-color text-[14px]">Demo Credentials:</h3>

                <div class="user-password-container mt-2 bg-[#F8FAFC] p-6 text-[14px]">
                    <p><strong>Username:</strong> admin</p>
                    <p><strong>Password:</strong> admin123</p>
                </div>
            </div>
        </div>
    </main>

    <script src="scripts/login.js"></script>
</body>
</html>
