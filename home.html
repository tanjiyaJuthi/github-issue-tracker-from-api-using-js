<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- daisy UI and tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="styles/tracker.css"></head>
<body>
    <header>
        <div class="navbar bg-base-100 shadow-sm">
            <div class="navbar-start">
                <!-- <div class="dropdown">
                    <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /> </svg>
                    </div>
                    <ul
                        tabindex="-1"
                        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                        <li><a>Item 1</a></li>
                        <li><a>Item 3</a></li>
                    </ul>
                </div> -->
                <a class="flex items-center text-xl">
                    <img class="w-7 h-7 mr-1" src="assets/github-logo.png" alt="GitHub Issues Tracker">
                    <span class="text-sm md:text-xl font-semibold">GitHub Issues Tracker</span>
                </a>
            </div>

            <div class="navbar-end">
                <label class="input mr-1 md:mr-4 p-1 max-h-[33px] md:max-h-none">
                    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <g
                        stroke-linejoin="round"
                        stroke-linecap="round"
                        stroke-width="2.5"
                        fill="none"
                        stroke="currentColor"
                        >
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                        </g>
                    </svg>

                    <input name="issue-search" class="outline-none focus:outline-none focus:ring-0 focus:border-transparent" type="search" required placeholder="Search Issues ..." />
                </label>

                <button class="btn btn-primary btn-sm md:btn-md text-white">+ New Issue</button>
            </div>
        </div>
    </header>

    <main class="bg-[#f8fafc]">
        <div class="main-container max-w-[1110px] mx-auto md:pt-[60px] md:pb-[60px]">
            <section class="tab-container bg-white shadow-lg rounded-lg p-6">
                <button data-id="tab-all" class="btn btn-primary btn-sm md:btn-md btn-large">All</button>
                <button data-id="tab-open" class="btn btn-neutral btn-sm md:btn-md btn-outline border-[#E4E4E7] text-[#64748B] hover:bg-primary hover:text-white hover:border-0">Open</button>
                <button data-id="tab-closed" class="btn btn-neutral btn-sm md:btn-md btn-outline border-[#E4E4E7] text-[#64748B] hover:bg-primary hover:text-white hover:border-0">Closed</button>
            </section>

            <section id="issue-container" class="mt-4 shadow-lg rounded-lg">
                <div class="issue-top-container flex justify-between items-center bg-white p-6 rounded-lg">
                    <div class="issue-number-container flex gap-2">
                        <img class="" src="assets/Aperture.png" alt="Aperture">
                        <div class="">
                            <p id="issue-number" class="font-semibold md:text-[20px]">50 Issues</p>
                            <p class="text-[8px] md:text-[12px] gray-color">Track and manage your project issues</p>
                        </div>
                    </div>

                    <div class="text-[12px] open-closed flex items-center gap-4">
                        <p id="open"><span></span> Open</p>
                        <p id="closed"><span></span> Closed</p>
                    </div>
                </div>

                <hr class="border-[#E4E4E7]"/>

                <div id="issue-bottom-container" class="grid grid-cols-1 md:grid-cols-4 gap-[13px] p-[25px]">
                    <div id="issue-card" class="card bg-base-100 shadow-lg border-t-3 border-[#00A96E]">
                        <div class="card-body space-y-3">
                            <div class="issue-criteria flex items-center justify-between">
                                <figure>
                                    <img src="assets/Open-Status.png" alt="open">
                                </figure>

                                <p id="issue-frequency" class="red-bg font-medium text-[12px] text-center max-w-[80px] rounded-2xl py-[6px] uppercase">
                                    HIGH
                                </p>
                            </div>

                            <div class="issue-description">
                                <h3 class="font-semibold text-[14px]">Fix navigation menu on mobile devices</h3>
                            
                                <p class="gray-color text-[12px] pt-2">The navigation menu doesn't collapse properly on mobile devices...</p>
                            </div>

                            <div class="bug-help-enhance uppercase flex items-center gap-1 text-center">
                                <p class="red-bg border border-[#EF4444] rounded-2xl md:py-1"><i class="fa-solid fa-bug"></i> BUG</p>
                                <p class="yellow-bg border border-[#D97706] rounded-2xl md:py-1"><i class="fa-regular fa-life-ring"></i> HELP WANTED</p>
                            </div>
                        </div>

                        <div class="border-t border-[#E4E4E7]"></div>

                        <div class="card-body gray-color text-[12px]">
                            <p>#1 by john_doe</p>
                            <p>1/15/2024</p>
                        </div>
                    </div>
                </div>
                
            </section>
        </div>
    </main>
    
    <script src="scripts/tracker.js"></script>
</body>
</html>
